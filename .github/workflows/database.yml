name: Database migrations

# Applies the SQL files in supabase/migrations to the Supabase project.
# - Pull request: dry run, lists the migrations that would be applied.
# - Merge into main: applies the new migrations (already applied ones are skipped).
on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:

# Never run two migrations against the database at the same time.
concurrency:
  group: database-migrations
  cancel-in-progress: false

jobs:
  migrations:
    name: ${{ github.event_name == 'pull_request' && 'Check migrations (dry run)' || 'Apply migrations' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: List pending migrations (dry run)
        if: github.event_name == 'pull_request'
        run: supabase db push --dry-run

      - name: Apply migrations
        if: github.event_name != 'pull_request'
        run: supabase db push
