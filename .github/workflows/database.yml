name: Database migrations

# Applies the SQL files in supabase/migrations to the Supabase project.
# - Pull request: dry run, lists the migrations that would be applied.
# - Merge into main: applies the new migrations (already applied ones are skipped).
on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:

# Never run two migrations against the database at the same time.
concurrency:
  group: database-migrations
  cancel-in-progress: false

jobs:
  migrations:
    name: ${{ github.event_name == 'pull_request' && 'Check migrations (dry run)' || 'Apply migrations' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Session pooler connection string (Supabase -> Connect -> Session pooler).
      # Connecting straight to Postgres means no access token is needed.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check the database secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL repository secret (see docs/database-migrations.md)."
            exit 1
          fi

      - name: List pending migrations (dry run)
        if: github.event_name == 'pull_request'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply migrations
        if: github.event_name != 'pull_request'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
